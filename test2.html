<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; padding: 0; }
  .page { display: flex; flex-direction: column; min-height: 100vh; background: #eee; }
  .container-luxe { 
    max-width: 1440px; 
    margin-inline: auto; 
    padding-inline: 20px; 
    display: grid; 
    grid-template-columns: 240px minmax(0, 1fr); 
    gap: 40px; 
    background: #ccc;
  }
  .sidebar { background: red; height: 100px; width: 100%; }
  .content { background: blue; width: 100%; min-width: 0; }
  .toolbar { display: flex; justify-content: space-between; background: yellow; }
  .inner-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; }
  .item { background: green; height: 100px; }
</style>
</head>
<body>
<div class='page'>
  <section class='container-luxe'>
    <div class='sidebar'>Sidebar</div>
    <div class='content'>
      <div class='toolbar'>
        <span>2 de 2</span>
        <span>Ordenar</span>
      </div>
      <div class='inner-grid'>
        <div class='item'>Short</div>
        <div class='item'>Short</div>
      </div>
    </div>
  </section>
</div>
</body>
</html>
